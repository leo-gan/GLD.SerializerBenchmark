# Run config: smoke for the tensor data set.
# Not smoke.yaml. An empty serializer filter selects serializer_data_sets
# for tensor on runners whose comma filter is exact. Invoke with:
#   BENCHMARK_RUN_CONFIG=config/library/tensor-smoke.yaml
id: tensor-smoke
description: "tensor, tensor_view, prompt, shard, and request at N=1; bytes; no post-compression"
data_model_version: 2

types:
  - type_id: tensor
    type_config: {}
  - type_id: tensor_view
    type_config: {}
  - type_id: prompt
    type_config: {}
  - type_id: shard
    type_config: {}
  - type_id: request
    type_config: {}

data_type_instance_count: [1]

compression:
  mode: none

execution:
  mode: smoke
  io_modes: [bytes]

budget:
  # Same wall-clock ladder as the other library configs.
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 600
  reps_fallback: 50
