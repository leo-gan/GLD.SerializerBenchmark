# Single settings file for this experiment.
# Change this file to change the experiment.

schema: gld.experiment.config/1
id: 09-compression-size
title: Just turn compression on
question: After gzip or zstd, does JSON stay larger than a dense binary format?

sample:
  kind: [strings, telemetry, message]
  records_per_write: 1
  seed: 42
  settings:
    points: 128
  saved_as: sample.json

run:
  mode: full
  io_modes: [bytes]
  compression: size_only
  compression_algorithms: [gzip_6, zstd_3]
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 600
  reps_fallback: 50

analysis:
  drop_first_trial: true
  filter_id: iqr_1.5
  main_io: memory
  require_named_fields: false
  top_group:
    method: cliffs_delta_vs_fastest
    similar_max: 0.147
    close_max: 0.33

paths:
  results: results.json
  summary: results.md

languages:
  - id: python
    enabled: true
    libraries:
      - {name: orjson, writes_named_fields: true, role: JSON}
      - {name: json, writes_named_fields: true, role: JSON — ships with Python}
      - {name: msgspec-msgpack, writes_named_fields: true, role: MessagePack}
      - {name: protobuf, writes_named_fields: true, role: Protocol Buffers}
