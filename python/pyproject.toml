[project]
name = "serializer-benchmark"
version = "0.2.0"
description = "Python serializer benchmark suite matching the C# benchmark design"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Leonid Ganeline", email = "leo.gan.57@gmail.com" },
]
# Serializer / codec deps: lower bound = minimum supported API, upper bound =
# next major (exclusive) so `uv lock --upgrade` / `uv sync -U` can pull newer
# *minor and patch* releases automatically without jumping to breaking majors.
# Example: cbor2>=6.0.0,<7 allows 6.1.3; it does not allow 7.x.
# (A lock file alone can pin an old patch — refresh it with upgrade, not only install.)
dependencies = [
    "protobuf>=7.34.1,<8",
    "orjson>=3.10.0,<4",
    "msgspec>=0.19.0,<1",
    "python-rapidjson>=1.20,<2",
    "msgpack>=1.1.0,<2",
    "cbor2>=6.0.0,<7",
    "fastavro>=1.10.0,<2",
    "cloudpickle>=3.1.0,<4",
    "pydantic>=2.10,<3",
    "mashumaro>=3.14,<4",
    "serpyco-rs>=1.13,<2",
    "dill>=0.3.9,<1",
    "flatbuffers>=25.12.19,<26",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
