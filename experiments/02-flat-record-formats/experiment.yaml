      - {name: "@msgpack/msgpack", writes_named_fields: true, role: MessagePack — official package}
      - {name: protobuf-es, writes_named_fields: true, role: Protocol Buffers}
      - {name: protobufjs, writes_named_fields: true, role: Protocol Buffers}

  - id: rust
    enabled: true
    libraries:
      - {name: serde_json, writes_named_fields: true, role: JSON — usual Rust library}
      - {name: sonic-rs, writes_named_fields: true, role: JSON — fast writer from Experiment 1}
      - {name: rmp-serde, writes_named_fields: true, role: MessagePack}
      - {name: prost, writes_named_fields: true, role: Protocol Buffers}

  - id: c
    enabled: true
    libraries:
      - {name: yyjson, writes_named_fields: true, role: JSON — fast writer from Experiment 1}
      - {name: cJSON, writes_named_fields: true, role: JSON — common C library}
      - {name: mpack, writes_named_fields: true, role: MessagePack}
      - {name: msgpack-c, writes_named_fields: true, role: MessagePack — official C library}
      # Suite name is protobuf-c (not "protobuf"). Google libprotobuf C did not run here.
      - {name: protobuf-c, writes_named_fields: true, role: Protocol Buffers — protobuf-c (timed path is the suite wire codec)}
      - {name: protobuf-wire, writes_named_fields: true, role: Protocol Buffers — in-tree wire helper}

  - id: cpp
    enabled: true
    libraries:
      - {name: nlohmann_json, writes_named_fields: true, role: JSON — common C++ library}
