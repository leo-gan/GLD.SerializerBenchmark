# Run config: publication cells for the tensor data set.
# Not default.yaml. Invoke with:
#   BENCHMARK_RUN_CONFIG=config/library/tensor.yaml
# An empty serializer filter selects serializer_data_sets for tensor
# on runners whose comma filter is exact. A serializer on this set runs every
# type below. Python: arrow-ipc, flatbuffers, gld-kiln. Mojo: gld-kiln.
# Python applies the map in the runner. Other serializers skip these type ids.
# N stays 1. The shape is the type config, not the instance count.
id: tensor
description: "tensor, tensor_view, prompt, shard, and request at N=1; bytes; no post-compression"
data_model_version: 2

types:
  - type_id: tensor
    type_config: {}
  - type_id: tensor_view
    type_config: {}
  - type_id: prompt
    type_config: {}
  - type_id: shard
    type_config: {}
  - type_id: request
    type_config: {}

data_type_instance_count: [1]

compression:
  mode: none

execution:
  mode: full
  io_modes: [bytes]

budget:
  # Same wall-clock ladder as the other library configs.
  # Past the soft budget the runner drops to reps_fallback, then stops at the hard cap.
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 600
  reps_fallback: 50
