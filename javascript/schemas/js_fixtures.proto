// Data Model v2 — JS fixtures (field sets aligned with schemas/v2/protobuf/benchmark_v2.proto)
syntax = "proto3";
package js_fixtures;

// --- message ---
message Message {
  bool f_bool = 1;
  int32 f_int32 = 2;
  int64 f_int64 = 3;
  double f_float64 = 4;
  string f_string = 5;
  bool f_bool_2 = 6;
  int32 f_int32_2 = 7;
  string f_string_2 = 8;
}

message BatchMessage {
  repeated Message items = 1;
}

// --- document ---
message DocumentMeta {
  string region = 1;
  int32 version = 2;
}

message DocumentItem {
  string sku = 1;
  int32 qty = 2;
  int64 price_minor = 3;
}

message Document {
  string id = 1;
  int32 status = 2;
  DocumentMeta meta = 3;
  repeated DocumentItem items = 4;
}

message BatchDocument {
  repeated Document items = 1;
}

// --- telemetry ---
message Telemetry {
  string source = 1;
  int64 ts = 2;
  repeated string tags = 3;
  repeated double values = 4;
}

message BatchTelemetry {
  repeated Telemetry items = 1;
}

// --- strings ---
message Strings {
  repeated string items = 1;
}

message BatchStrings {
  repeated Strings items = 1;
}

// --- event ---
message EventAttr {
  string key = 1;
  string value = 2;
}

message Event {
  string event_id = 1;
  string event_type = 2;
  int64 occurred_at = 3;
  string producer = 4;
  repeated EventAttr attrs = 5;
}

message BatchEvent {
  repeated Event items = 1;
}
