syntax = "proto3";
package js_fixtures;

message Passport {
  string Number = 1;
  string Authority = 2;
  string ExpirationDate = 3;
}
message PoliceRecord {
  int32 Id = 1;
  string CrimeCode = 2;
}
message Person {
  string FirstName = 1;
  string LastName = 2;
  uint32 Age = 3;
  int32 Gender = 4;
  Passport Passport = 5;
  repeated PoliceRecord PoliceRecords = 6;
}
message SimpleObject {
  int32 Id = 1;
  string Name = 2;
  string Timestamp = 3;
  bool IsActive = 4;
}
message StringArrayObject {
  repeated string Items = 1;
}
message TelemetryData {
  string Id = 1;
  string DataSource = 2;
  string TimeStamp = 3;
  int32 Param1 = 4;
  uint32 Param2 = 5;
  repeated double Measurements = 6;
  int64 AssociatedProblemID = 7;
  int64 AssociatedLogID = 8;
  bool WasProcessed = 9;
}
message ServiceLine {
  string ServiceCode = 1;
  double ChargeAmount = 2;
  double AdjudicatedAmount = 3;
}
message Claim {
  string ClaimId = 1;
  string PatientName = 2;
  double TotalCharge = 3;
  double PaymentAmount = 4;
  repeated ServiceLine Lines = 5;
}
message EDI835 {
  string PayerName = 1;
  string PayeeName = 2;
  string PaymentDate = 3;
  double TotalActualAmount = 4;
  string TransactionControlNumber = 5;
  repeated Claim Claims = 6;
}
message IntegerValue {
  int32 value = 1;
}

// Flat graph with index edges (cycles without recursive identity).
message GraphNodeData {
  string Name = 1;
  int32 Parent = 2;
  int32 Related = 3;
  repeated int32 Children = 4;
}
message ObjectGraph {
  int32 root = 1;
  repeated GraphNodeData nodes = 2;
}
