name: Benchmark CI

# Per-language smoke when that harness changes; analysis unit tests when analysis/
# or shared config/scripts change. Shared schemas/** still fan out to all language
# jobs (fixture contract). Summaries/plots are committed under docs/ — not built here.
#
# Why a C#-only commit on a mixed PR still showed every language job:
# dorny/paths-filter on pull_request compares the *whole PR* to the base branch.
# Older filters also listed config/scripts/workflow on *every* language, so any
# shared-file change forced the full matrix. Language jobs now key mainly on
# their own tree.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'site/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'site/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark mode'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - all-single
          - full

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      csharp: ${{ steps.filter.outputs.csharp }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      c: ${{ steps.filter.outputs.c }}
      javascript: ${{ steps.filter.outputs.javascript }}
      go: ${{ steps.filter.outputs.go }}
      analysis: ${{ steps.filter.outputs.analysis }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # pull_request: all files in the PR vs base (not only the tip commit).
          # push: files in the push. workflow_dispatch: jobs use inputs, not filters.
          filters: |
            csharp:
              - 'c-sharp/**'
              - 'schemas/**'
            python:
              - 'python/**'
              - 'schemas/**'
            rust:
              - 'rust/**'
              - 'schemas/**'
            c:
              - 'c/**'
              - 'schemas/**'
            javascript:
              - 'javascript/**'
              - 'schemas/**'
            go:
              - 'go/**'
              - 'schemas/**'
            analysis:
              - 'analysis/**'
              - 'config/benchmark_config.yaml'
              - 'schemas/**'
              - 'scripts/lib/**'
              - 'scripts/read-config.py'
              - 'scripts/run-all-benchmarks.sh'
              - 'scripts/verify-results.sh'
              - '.github/workflows/benchmark-ci.yml'

  csharp-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run C# Benchmark
        run: |
          cd c-sharp
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  python-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Python Benchmark
        run: |
          cd python
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  rust-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Benchmark
        run: |
          cd rust
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  c-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.c == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Run C Benchmark
        run: |
          cd c
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  javascript-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: javascript/package-lock.json

      - name: Install dependencies
        run: |
          cd javascript
          npm ci

      - name: Run JavaScript Benchmark
        run: |
          cd javascript
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  go-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go/go.sum

      - name: Install protoc (optional regen of committed gen/pb)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run Go Benchmark
        run: |
          cd go
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  analysis-unit-tests:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.analysis == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis package with test deps
        run: |
          cd analysis
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          cd analysis
          .venv/bin/pytest -q

      - name: Smoke read-config (master YAML)
        # Use the analysis venv (has PyYAML); system python3 alone cannot load the config.
        run: |
          set -euo pipefail
          PY=analysis/.venv/bin/python
          $PY scripts/read-config.py --enabled-langs | grep -qw go
          $PY scripts/read-config.py --lang-runners | grep -E '^(csharp|python|rust|c|javascript|go)\|'
          test "$($PY scripts/read-config.py --mode-reps smoke)" = "2"
