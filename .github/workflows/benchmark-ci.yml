name: Benchmark CI

# Per-language smoke when that language's *source* changes; analysis unit tests when
# analysis/ or shared config/scripts change. Real shared contracts
# (schemas/data_catalog_v2.yaml, schemas/v2/**/*.proto) still fan out to all
# language jobs. Prose under schemas/ (README.md) must not. Pure docs/prose PRs
# are skipped via paths-ignore (workflow-level). Summaries/plots are committed
# under docs/ — not built here.
#
# Benchmark runners run natively (no Docker): each job installs the language toolchain
# before scripts/run-benchmarks.sh.
#
# Path policy (aligned with prepare-pr detect-changed-langs.sh):
# - Workflow paths-ignore: pure docs/prose PRs never start this workflow.
# - dorny filters use *positive* globs only. Do NOT add '!…' negation rules:
#   with predicate-quantifier "some" (dorny default), each pattern is a separate
#   matcher, and a standalone '!foo/**/*.md' matches almost every path that is
#   *not* that pattern — so every language job incorrectly ran on every PR.
# - Do not use schemas/** — it matches schemas/v2/README.md and fans out
#   every language job when a language PR also edits that README.
# - Prose under a lang tree is still skipped for pure-docs PRs via paths-ignore.
# - pull_request filters still compare the *whole PR* to the base branch.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.rst'
      - '**/*.txt'
      - '**/README'
      - '**/README.*'
      - 'LICENSE'
      - 'LICENSE.*'
      - '.gitignore'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'site/**'
      - 'dashboard/**'
      - '.grok/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.rst'
      - '**/*.txt'
      - '**/README'
      - '**/README.*'
      - 'LICENSE'
      - 'LICENSE.*'
      - '.gitignore'
      - 'docs/**'
      - 'mkdocs.yml'
      - 'site/**'
      - 'dashboard/**'
      - '.grok/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark mode'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - all-single
          - full

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      csharp: ${{ steps.filter.outputs.csharp }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      c: ${{ steps.filter.outputs.c }}
      javascript: ${{ steps.filter.outputs.javascript }}
      go: ${{ steps.filter.outputs.go }}
      java: ${{ steps.filter.outputs.java }}
      kotlin: ${{ steps.filter.outputs.kotlin }}
      php: ${{ steps.filter.outputs.php }}
      cpp: ${{ steps.filter.outputs.cpp }}
      swift: ${{ steps.filter.outputs.swift }}
      zig: ${{ steps.filter.outputs.zig }}
      mojo: ${{ steps.filter.outputs.mojo }}
      analysis: ${{ steps.filter.outputs.analysis }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # pull_request: all files in the PR vs base (not only the tip commit).
          # push: files in the push. workflow_dispatch: jobs use inputs, not filters.
          # Positive globs only — see header comment (standalone '!…' is unsafe with some).
          # Shared *contracts* select every language; schemas/v2/README.md must not.
          # Note: 'c/**' does not match 'c-sharp/**' (trailing slash segment required).
          filters: |
            csharp:
              - 'c-sharp/**'
              - 'schemas/data_catalog_v2.yaml'
              - 'schemas/v2/**/*.proto'
            python:
              - 'python/**'
              - 'schemas/data_catalog_v2.yaml'
              - 'schemas/v2/**/*.proto'
            rust:
              - 'rust/**'
              - 'schemas/data_catalog_v2.yaml'
              - 'schemas/v2/**/*.proto'
            c:
              - 'c/**'
              - 'schemas/data_catalog_v2.yaml'
              - 'schemas/v2/**/*.proto'
            javascript:
              - 'javascript/**'
              - 'schemas/data_catalog_v2.yaml'
              - 'schemas/v2/**/*.proto'
            go:
              - 'go/**'
              - 'schemas/data_catalog_v2.yaml'
              - 'schemas/v2/**/*.proto'
            java:
              - 'java/**'
              - 'schemas/data_catalog_v2.yaml'
              - 'schemas/v2/**/*.proto'
            kotlin:
              - 'kotlin/**'
              - 'schemas/data_catalog_v2.yaml'
              - 'schemas/v2/**/*.proto'
            php:
              - 'php/**'
              - 'schemas/data_catalog_v2.yaml'
              - 'schemas/v2/**/*.proto'
            cpp:
              - 'cpp/**'
              - 'schemas/data_catalog_v2.yaml'
              - 'schemas/v2/**/*.proto'
            swift:
              - 'swift/**'
              - 'schemas/data_catalog_v2.yaml'
              - 'schemas/v2/**/*.proto'
            zig:
              - 'zig/**'
              - 'schemas/data_catalog_v2.yaml'
              - 'schemas/v2/**/*.proto'
            mojo:
              - 'mojo/**'
              - 'schemas/data_catalog_v2.yaml'
              - 'schemas/v2/**/*.proto'
            analysis:
              - 'analysis/**'
              - 'config/benchmark_config.yaml'
              - 'schemas/data_catalog_v2.yaml'
              - 'schemas/v2/**/*.proto'
              - 'scripts/lib/**'
              - 'scripts/read-config.py'
              - 'scripts/run-all-benchmarks.sh'
              - 'scripts/verify-results.sh'
              - 'scripts/check-host-requirements.sh'
              - 'scripts/install-host-requirements.sh'
              - '.github/workflows/benchmark-ci.yml'

  csharp-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.csharp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SDK 10 for the net10.0 target; it also supports LightProto's source generator.
      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # resolve_run_config.py (v2 cells) needs PyYAML; analysis package optional for sidecars
      - name: Setup Python for run-config resolution
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML (resolve_run_config)
        run: pip install pyyaml

      - name: Check host requirements (csharp)
        run: ./scripts/check-host-requirements.sh csharp

      - name: Run C# Benchmark
        run: |
          cd c-sharp
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

      # Columnar types are not in smoke.yaml. A comma means exact names.
      # sbe is omitted (no Org.SbeTool.Sbe.Dll 1.40.2). No ORC row.
      - name: Run C# columnar smoke
        env:
          BENCHMARK_RUN_CONFIG: ${{ github.workspace }}/config/library/columnar-smoke.yaml
          BENCHMARK_TS: ${{ github.run_id }}-csharp-columnar
        run: |
          cd c-sharp
          ./scripts/run-benchmarks.sh custom 2 "arrow-ipc,parquet,parquet-uncompressed,System.Text.Json,Google.Protobuf,FlatSharp,Apache.Avro"
          err="../logs/csharp/${BENCHMARK_TS}.errors.csv"
          if [[ -f "$err" ]]; then
            echo "columnar smoke wrote an error CSV"
            cat "$err"
            exit 1
          fi

  python-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'python/uv.lock'

      - name: Setup Python 3.12 (via uv)
        run: uv python install 3.12

      - name: Check host requirements (python)
        run: ./scripts/check-host-requirements.sh python

      - name: Run Python Benchmark
        run: |
          cd python
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

      # Second smoke: the four columnar types are not in smoke.yaml.
      # The allow-list is required. "parquet" and "orc" also match the
      # uncompressed rows. Do not point smoke_run_config at this file.
      - name: Run Python columnar smoke
        run: |
          cd python
          BENCHMARK_RUN_CONFIG="${GITHUB_WORKSPACE}/config/library/columnar-smoke.yaml" \
            ./scripts/run-benchmarks.sh custom 2 "arrow-ipc,parquet,orc,orjson,protobuf,flatbuffers,avro"

  rust-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check host requirements (rust)
        run: ./scripts/check-host-requirements.sh rust

      - name: Run Rust Benchmark
        run: |
          cd rust
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

      # Second smoke: the four columnar types are not in smoke.yaml.
      # Comma-separated names are case-insensitive exact matches, so
      # "parquet" does not also select parquet-uncompressed.
      # Do not point smoke_run_config at this file.
      - name: Run Rust columnar smoke
        env:
          BENCHMARK_RUN_CONFIG: ${{ github.workspace }}/config/library/columnar-smoke.yaml
          BENCHMARK_TS: ${{ github.run_id }}-rust-columnar
        run: |
          cd rust
          ./scripts/run-benchmarks.sh custom 2 "arrow-ipc,parquet,parquet-uncompressed,sbe,serde_json,prost,serde_avro_fast"
          err="../logs/rust/${BENCHMARK_TS}.errors.csv"
          if [[ -f "$err" ]]; then
            echo "columnar smoke wrote an error CSV"
            cat "$err"
            exit 1
          fi

  c-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.c == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install C build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config curl libjson-c-dev zlib1g-dev liblzma-dev

      - name: Check host requirements (c)
        run: ./scripts/check-host-requirements.sh c

      - name: Run C Benchmark
        run: |
          cd c
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  javascript-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: javascript/package-lock.json

      - name: Install dependencies
        run: |
          cd javascript
          npm ci

      - name: Check host requirements (javascript)
        run: ./scripts/check-host-requirements.sh javascript

      - name: Run JavaScript Benchmark
        run: |
          cd javascript
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  go-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Match go/go.mod (go 1.27.0 / toolchain go1.27.1)
          go-version: '1.27.x'
          cache-dependency-path: go/go.sum

      - name: Install protoc (optional regen of committed gen/pb)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check host requirements (go)
        run: ./scripts/check-host-requirements.sh go

      - name: Run Go Benchmark
        env:
          GOTOOLCHAIN: auto
        run: |
          cd go
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

      # Columnar types are not in smoke.yaml. The comma list is an exact-name
      # allow-list. SBE sources are committed, so this job does not need a JDK.
      - name: Run Go columnar smoke
        env:
          GOTOOLCHAIN: auto
          BENCHMARK_RUN_CONFIG: ${{ github.workspace }}/config/library/columnar-smoke.yaml
          BENCHMARK_TS: ${{ github.run_id }}-columnar
        run: |
          cd go
          ./scripts/run-benchmarks.sh custom 2 "arrow-ipc,parquet,parquet-uncompressed,sbe,encoding/json,protobuf,hamba/avro"
          err="../logs/go/${BENCHMARK_TS}.errors.csv"
          if [[ -f "$err" ]]; then
            echo "columnar smoke wrote an error CSV"
            cat "$err"
            exit 1
          fi

  java-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      # resolve_run_config.py (v2 cells) needs PyYAML
      - name: Setup Python for run-config resolution
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML (resolve_run_config)
        run: pip install pyyaml

      - name: Check host requirements (java)
        run: ./scripts/check-host-requirements.sh java

      - name: Run Java Benchmark
        run: |
          cd java
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

      # Columnar types are not in smoke.yaml. A comma means exact names.
      # Do not point smoke_run_config at this file.
      - name: Run Java columnar smoke
        env:
          BENCHMARK_RUN_CONFIG: ${{ github.workspace }}/config/library/columnar-smoke.yaml
          BENCHMARK_TS: ${{ github.run_id }}-java-columnar
        run: |
          cd java
          ./scripts/run-benchmarks.sh custom 2 "arrow-ipc,parquet,parquet-uncompressed,orc,orc-uncompressed,sbe,jackson,protobuf,flatbuffers,avro"
          err="../logs/java/${BENCHMARK_TS}.errors.csv"
          if [[ -f "$err" ]]; then
            echo "columnar smoke wrote an error CSV"
            cat "$err"
            exit 1
          fi

  kotlin-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.kotlin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: kotlin/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Python for run-config resolution
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML (resolve_run_config)
        run: pip install pyyaml

      - name: Check host requirements (kotlin)
        run: ./scripts/check-host-requirements.sh kotlin

      - name: Run Kotlin Benchmark
        run: |
          cd kotlin
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  php-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Setup Python for run-config resolution
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML (resolve_run_config)
        run: pip install pyyaml

      - name: Check host requirements (php)
        run: ./scripts/check-host-requirements.sh php

      - name: Run PHP Benchmark
        run: |
          cd php
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  cpp-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # C++20, CMake FetchContent (git), and resolve_run_config (PyYAML)
      - name: Install C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential git pkg-config libboost-serialization-dev zlib1g-dev liblzma-dev

      - name: Setup Python for run-config resolution
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML (resolve_run_config)
        run: pip install pyyaml

      - name: Check host requirements (cpp)
        run: ./scripts/check-host-requirements.sh cpp

      # Columnar rows link only when ARROW_ROOT is set. Fail if this
      # runner cannot install Arrow 25.0.1, instead of skipping the rows.
      - name: Install Apache Arrow C++ 25.0.1
        run: |
          set -euo pipefail
          . /etc/os-release
          case "${VERSION_CODENAME}" in
            jammy|noble) ;;
            *)
              echo "Apache Arrow apt packages are published for jammy and noble, not ${VERSION_CODENAME}."
              echo "Refusing to build C++ without the Arrow rows."
              exit 1
              ;;
          esac
          sudo apt-get install -y ca-certificates wget
          wget -O /tmp/apache-arrow-apt-source.deb \
            "https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-${VERSION_CODENAME}.deb"
          sudo apt-get install -y -V /tmp/apache-arrow-apt-source.deb
          sudo apt-get update
          cand="$(apt-cache madison libarrow-dev | awk '{print $3}' | grep '^25\.0\.1-' | head -1)"
          pq="$(apt-cache madison libparquet-dev | awk '{print $3}' | grep '^25\.0\.1-' | head -1)"
          if [[ -z "${cand}" || -z "${pq}" ]]; then
            echo "libarrow-dev / libparquet-dev 25.0.1 are not in the Apache Arrow apt repo for ${VERSION_CODENAME}."
            apt-cache madison libarrow-dev || true
            apt-cache madison libparquet-dev || true
            exit 1
          fi
          sudo apt-get install -y -V "libarrow-dev=${cand}" "libparquet-dev=${pq}"
          grep -q 'ARROW_VERSION_STRING "25.0.1"' /usr/include/arrow/util/config.h
          test -e /usr/lib/x86_64-linux-gnu/libarrow.so
          echo "ARROW_ROOT=/usr" >> "$GITHUB_ENV"

      - name: Run C++ Benchmark
        run: |
          cd cpp
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

      # Columnar types are not in smoke.yaml. A comma means exact names.
      # ARROW_ROOT from the install step keeps the five Arrow rows in the binary.
      - name: Run C++ columnar smoke
        env:
          BENCHMARK_RUN_CONFIG: ${{ github.workspace }}/config/library/columnar-smoke.yaml
          BENCHMARK_TS: ${{ github.run_id }}-cpp-columnar
        run: |
          cd cpp
          ./scripts/run-benchmarks.sh custom 2 "arrow-ipc,parquet,parquet-uncompressed,orc,orc-uncompressed,sbe,nlohmann_json,protobuf,flatbuffers,avro"
          err="../logs/cpp/${BENCHMARK_TS}.errors.csv"
          if [[ -f "$err" ]]; then
            echo "columnar smoke wrote an error CSV"
            cat "$err"
            exit 1
          fi


  swift-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (cmake, g++, libstdc++)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ libstdc++-12-dev

      - name: Install Swift toolchain + Cap'n Proto
        run: ./scripts/install-host-requirements.sh swift

      - name: Setup Python for run-config resolution
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML (resolve_run_config)
        run: pip install pyyaml

      - name: Check host requirements (swift)
        run: ./scripts/check-host-requirements.sh swift

      - name: Run Swift Benchmark
        run: |
          cd swift
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  zig-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.zig == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig toolchain
        run: ./scripts/install-host-requirements.sh zig

      - name: Setup Python for run-config resolution
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML (resolve_run_config)
        run: pip install pyyaml

      - name: Check host requirements (zig)
        run: ./scripts/check-host-requirements.sh zig

      - name: Run Zig tests
        run: |
          export PATH="${HOME}/.local/zig:${PATH}"
          cd zig
          zig build test

      - name: Run Zig Benchmark
        run: |
          export PATH="${HOME}/.local/zig:${PATH}"
          cd zig
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  mojo-benchmark:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.mojo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Mojo toolchain
        run: ./scripts/install-host-requirements.sh mojo

      - name: Setup Python for run-config resolution
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML (resolve_run_config)
        run: pip install pyyaml

      - name: Check host requirements (mojo)
        run: |
          export PATH="${HOME}/.pixi/bin:${PATH}"
          ./scripts/check-host-requirements.sh mojo

      - name: Run Mojo roundtrip tests
        run: |
          export PATH="${HOME}/.pixi/bin:${PATH}"
          cd mojo
          pixi run test

      - name: Run Mojo Benchmark
        run: |
          export PATH="${HOME}/.pixi/bin:${PATH}"
          ./mojo/scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  analysis-unit-tests:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.analysis == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis package with test deps
        run: |
          cd analysis
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          cd analysis
          .venv/bin/pytest -q

      - name: Smoke read-config (master YAML)
        # Use the analysis venv (has PyYAML); system python3 alone cannot load the config.
        run: |
          set -euo pipefail
          PY=analysis/.venv/bin/python
          $PY scripts/read-config.py --enabled-langs | grep -qw go
          $PY scripts/read-config.py --enabled-langs | grep -qw java
          $PY scripts/read-config.py --enabled-langs | grep -qw kotlin
          $PY scripts/read-config.py --enabled-langs | grep -qw php
          $PY scripts/read-config.py --enabled-langs | grep -qw cpp
          $PY scripts/read-config.py --enabled-langs | grep -qw swift
          $PY scripts/read-config.py --enabled-langs | grep -qw zig
          $PY scripts/read-config.py --enabled-langs | grep -qw mojo
          $PY scripts/read-config.py --lang-runners | grep -E '^(csharp|python|rust|c|javascript|go|java|kotlin|php|cpp|swift|zig|mojo)\|'
          test "$($PY scripts/read-config.py --mode-reps smoke)" = "2"
