[workspace]
name = "serializer-benchmark-mojo"
version = "0.3.1"
description = "Mojo serializer benchmark runner for Data Model v2"
authors = ["GLD.SerializerBenchmark"]
channels = [
    "https://conda.modular.com/max",
    "https://repo.prefix.dev/modular-community",
    "https://prefix.dev/leo-gan/leo-gan",
    "conda-forge",
]
platforms = ["linux-64"]

[dependencies]
mojo = "==1.1.0"
# EmberJson 0.3.4's conda package is a Mojo 1.0 .mojoc. The sources are
# vendored under vendor/emberjson_src and compiled with this compiler.

[tasks]
version = "mojo --version"
build = "mojo build -I src src/main.mojo -o serializer-benchmark-mojo"
run = "mojo run -I src src/main.mojo"
test = "mojo run -I src -I vendor/cbor_src -I vendor/pb_src -I vendor/toml_src -I vendor/ehsanmok_src -I vendor/gldjson_src -I vendor/yaml_src -I vendor/msgpack_src -I vendor/fb_src -I vendor/avro_src -I vendor/emberjson_src tests/test_roundtrip.mojo"
