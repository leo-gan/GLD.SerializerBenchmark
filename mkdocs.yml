site_name: Multi-Language Serializer Benchmark
site_description: Multi-language serialization performance comparison.
site_url: https://leo-gan.github.io/GLD.SerializerBenchmark/
repo_url: https://github.com/leo-gan/GLD.SerializerBenchmark
repo_name: leo-gan/GLD.SerializerBenchmark

exclude_docs: |
  dashboard/logs/**


theme:
  name: material
  features:
    # Header: top-level sections as tabs (Serialization 101, C#, Python, …)
    - navigation.tabs
    - navigation.tabs.sticky
    # Left sidebar: only 2nd-level pages for the active tab (no page ToC here)
    - navigation.sections
    - navigation.tracking
    - navigation.instant
    - navigation.top
    # Right sidebar: in-page headings (requires toc.integrate OFF)
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - redirects:
      redirect_maps:
        'index.md': 'theory/index.md'
        'serializers/index.md': 'analysis/serialization_categories.md'
        'serializers/json.md': 'analysis/serialization_categories.md'
        'serializers/binary.md': 'analysis/serialization_categories.md'
        'serializers/schema.md': 'analysis/serialization_categories.md'
        'serializers/native.md': 'analysis/serialization_categories.md'
        'architecture/index.md': 'analysis/architecture.md'
        'architecture/ADDING_A_LANGUAGE.md': 'analysis/ADDING_A_LANGUAGE.md'

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  # use_pygments: false — avoids a Pygments/html.escape(None) crash with current
  # pymdownx+Pygments that silently breaks all ``` fenced blocks site-wide.
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Serialization 101:
      - Theory & Practices: theory/index.md
      - Historical: theory/historical_perspective.md
      - Data Science: theory/data_science_perspective.md
      - Engineering: theory/engineer_perspective.md
      - Deep dives:
          - Overview: theory/deep-dives/index.md
          - Memory layout, alignment, and endianness: theory/deep-dives/memory-layout.md
          - Where encode/decode time actually goes: theory/deep-dives/encode-decode-cost.md
          - Self-describing vs schema-dependent: theory/deep-dives/self-describing-vs-schema-dependent.md
          - Schema evolution that doesn’t break readers: theory/deep-dives/schema-evolution.md
          - Dynamic binary vs IDL binary: theory/deep-dives/dynamic-vs-idl-binary.md
          - Zero-copy layouts: theory/deep-dives/zero-copy.md
  - C#:
      - Overview: c-sharp/index.md
      - Results: c-sharp/results.md
  - Python:
      - Overview: python/index.md
      - Results: python/results.md
  - Rust:
      - Overview: rust/index.md
      - Results: rust/results.md
  - C:
      - Overview: c/index.md
      - Results: c/results.md
  - JavaScript:
      - Overview: javascript/index.md
      - Results: javascript/results.md
  - Go:
      - Overview: go/index.md
      - Results: go/results.md
  - Benchmarks:
      - Overview: analysis/index.md
      - 📊 Dashboard: dashboard/
      - Architecture: analysis/architecture.md
      - Adding a Language: analysis/ADDING_A_LANGUAGE.md
      - Categories: analysis/serialization_categories.md
      - Methodology: analysis/ANALYSIS_METHODOLOGY.md
      - Metrics: analysis/METRICS.md
      - Test Data: analysis/test_data_configuration.md
      - Results Summary: analysis/BENCHMARK_SUMMARY.md
