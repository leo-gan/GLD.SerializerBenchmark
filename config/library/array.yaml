# Run config: publication cells for the array data set.
# Not default.yaml. Invoke with:
#   BENCHMARK_RUN_CONFIG=config/library/array.yaml
# Pass an explicit serializer allow-list. Fortran:
#   hdf5-fortran,netcdf-fortran,adios2
# The Fortran runner also skips every other serializer on these type ids.
# N stays 1. The array shape is the type config, not the instance count.
id: array
description: "grid and grid_window at N=1; bytes sidecar; no post-compression"
data_model_version: 2

types:
  - type_id: grid
    type_config: {}
  - type_id: grid_window
    type_config: {}

data_type_instance_count: [1]

compression:
  mode: none

execution:
  mode: full
  io_modes: [bytes]

budget:
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 600
  reps_fallback: 50
