# Run config: the graph data type (shared nodes and one reference cycle).
# Not default.yaml and not smoke.yaml. Invoke with:
#   BENCHMARK_RUN_CONFIG=config/library/graph.yaml
# An empty serializer filter selects serializer_data_sets for graph
# on runners whose comma filter is exact. Tree codecs are not in that map.
# Python smoke:
#   cd python && BENCHMARK_RUN_CONFIG=../config/library/graph.yaml \
#     ./scripts/run-benchmarks.sh custom 2 "dagr-packed,dagr-regular,dagr-frozen,dagr-frozen-packed,pickle"
id: graph
description: "graph at N=1 and N=100; bytes; no post-compression"
data_model_version: 2

types:
  - type_id: graph
    type_config: {}
    data_type_instance_count: [1, 100]

data_type_instance_count: [1, 100]

compression:
  mode: none

execution:
  mode: full
  io_modes: [bytes]

budget:
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 600
  reps_fallback: 50
