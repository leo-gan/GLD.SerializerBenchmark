site_name: Multi-Language Serializer Benchmark
site_description: Multi-language serialization performance comparison.
site_url: https://leo-gan.github.io/GLD.SerializerBenchmark/
repo_url: https://github.com/leo-gan/GLD.SerializerBenchmark
repo_name: leo-gan/GLD.SerializerBenchmark

exclude_docs: |
  dashboard/logs/**


theme:
  name: material
  features:
    # Header: top-level sections as tabs (Serialization, C#, Python, …)
    - navigation.tabs
    - navigation.tabs.sticky
    # Left sidebar: sections under the active tab
    - navigation.sections
    - navigation.tracking
    - navigation.instant
    - navigation.top
    # Right sidebar: in-page headings (requires toc.integrate OFF)
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - redirects:
      redirect_maps:
        'index.md': 'theory/101/index.md'
        'theory/index.md': 'theory/101/index.md'
        'theory/historical_perspective.md': 'theory/101/historical_perspective.md'
        'theory/data_science_perspective.md': 'theory/101/data_science_perspective.md'
        'theory/engineer_perspective.md': 'theory/101/engineer_perspective.md'
        'theory/deep-dives/index.md': 'theory/201/index.md'
        'theory/deep-dives/memory-layout.md': 'theory/201/memory-layout.md'
        'theory/deep-dives/encode-decode-cost.md': 'theory/201/encode-decode-cost.md'
        'theory/deep-dives/self-describing-vs-schema-dependent.md': 'theory/201/self-describing-vs-schema-dependent.md'
        'theory/deep-dives/schema-evolution.md': 'theory/201/schema-evolution.md'
        'theory/deep-dives/dynamic-vs-idl-binary.md': 'theory/201/dynamic-vs-idl-binary.md'
        'theory/deep-dives/zero-copy.md': 'theory/201/zero-copy.md'
        'theory/deep-dives/compression-is-not-a-format.md': 'theory/201/compression-is-not-a-format.md'
        'serializers/index.md': 'analysis/serialization_categories.md'
        'serializers/json.md': 'analysis/serialization_categories.md'
        'serializers/binary.md': 'analysis/serialization_categories.md'
        'serializers/schema.md': 'analysis/serialization_categories.md'
        'serializers/native.md': 'analysis/serialization_categories.md'
        'architecture/index.md': 'analysis/architecture.md'
        'architecture/ADDING_A_LANGUAGE.md': 'analysis/ADDING_A_LANGUAGE.md'

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  # use_pygments: false — avoids a Pygments/html.escape(None) crash with current
  # pymdownx+Pygments that silently breaks all ``` fenced blocks site-wide.
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Serialization:
