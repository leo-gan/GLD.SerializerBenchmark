# Single settings file for this experiment.
# Change this file to change the experiment.

schema: gld.experiment.config/1
id: 05-event-log-formats
title: What should we use for an event log?
question: On one “something happened” record, how do Avro, Protocol Buffers, and JSON compare on size and write time?
story:
  why: Event logs keep facts for months. Size drives disk cost. Write time drives the producer’s CPU. Compatibility (old and new software together) is why Avro and Protocol Buffers exist.
  example: A shop writes an “order placed” record many times each day and keeps those records for months. Customers and partners still receive JSON at the public edge of the system.
  tradeoff: JSON is easy for people to read, but old and new software can silently disagree about the fields. Avro and Protocol Buffers usually write fewer bytes and were designed so that old and new software can work together. A faster format is not useful if old and new versions cannot both read the log.

sample:
  kind: event
  records_per_write: [1, 100]
  seed: 42
  settings: {}
  saved_as: sample.json

run:
  mode: full
  io_modes: [bytes, stream]
  compression: size_only
  compression_algorithms: [gzip_6, zstd_3]
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 600
  reps_fallback: 50

analysis:
  drop_first_trial: true
  filter_id: iqr_1.5
  main_io: memory
  require_named_fields: false
  top_group:
    method: cliffs_delta_vs_fastest
    similar_max: 0.147
    close_max: 0.33

paths:
  results: results.json
  summary: results.md

languages:
  - id: python
    enabled: true
    libraries:
      - {name: orjson, writes_named_fields: true, role: JSON — fast writer from Experiment 1}
      - {name: avro, writes_named_fields: true, role: Avro}
      - {name: protobuf, writes_named_fields: true, role: Protocol Buffers}

  - id: java
    enabled: true
    libraries:
      - {name: jackson, writes_named_fields: true, role: JSON — common default}
      - {name: avro, writes_named_fields: true, role: Avro}
      - {name: protobuf, writes_named_fields: true, role: Protocol Buffers}

  - id: kotlin
    enabled: true
    libraries:
      - {name: jackson, writes_named_fields: true, role: JSON — common default}
      - {name: avro, writes_named_fields: true, role: Avro}
      - {name: avro4k, writes_named_fields: true, role: Avro — avro4k}
      - {name: protobuf, writes_named_fields: true, role: Protocol Buffers}

  - id: php
    enabled: true
    libraries:
      - {name: json, writes_named_fields: true, role: JSON — stdlib}
      - {name: avro, writes_named_fields: true, role: Avro}
      - {name: protobuf, writes_named_fields: true, role: Protocol Buffers}

  - id: go
    enabled: true
    libraries:
      - {name: sonic, writes_named_fields: true, role: JSON — fast writer}
      - {name: encoding/json, writes_named_fields: true, role: JSON — ships with Go}
      - {name: hamba/avro, writes_named_fields: true, role: Avro — binds to structs}
      - {name: linkedin/goavro, writes_named_fields: true, role: Avro — maps, Kafka world}
      - {name: protobuf, writes_named_fields: true, role: Protocol Buffers}

  - id: csharp
    enabled: true
    libraries:
      - {name: SpanJson, writes_named_fields: true, role: JSON — Experiment 1}
      - {name: Apache.Avro, writes_named_fields: true, role: Avro}
      - {name: Google.Protobuf, writes_named_fields: true, role: Protocol Buffers}

  - id: rust
    enabled: true
    libraries:
      - {name: sonic-rs, writes_named_fields: true, role: JSON — Experiment 1}
      - {name: serde_avro_fast, writes_named_fields: true, role: Avro}
      - {name: prost, writes_named_fields: true, role: Protocol Buffers}

  - id: javascript
    enabled: true
    libraries:
      - {name: JSON.stringify, writes_named_fields: true, role: JSON}
      - {name: avsc, writes_named_fields: true, role: Avro}
      - {name: protobufjs, writes_named_fields: true, role: Protocol Buffers}

  - id: c
    enabled: true
    libraries:
      - {name: yyjson, writes_named_fields: true, role: JSON — Experiment 1}
      - {name: avro-c, writes_named_fields: true, role: Avro}
      - {name: protobuf-wire, writes_named_fields: true, role: Protocol Buffers — wire helper}

  - id: cpp
    enabled: true
    libraries:
      - {name: nlohmann_json, writes_named_fields: true, role: JSON}
      - {name: avro, writes_named_fields: true, role: Avro}
      - {name: avro_c, writes_named_fields: true, role: Avro — C library from C++}
      - {name: protobuf-wire, writes_named_fields: true, role: Protocol Buffers — wire helper}

  - id: swift
    enabled: true
    libraries:
      - {name: IkigaJSON, writes_named_fields: true, role: JSON — Experiment 1}
      - {name: SwiftAvroCore, writes_named_fields: true, role: Avro}
      - {name: SwiftProtobuf, writes_named_fields: true, role: Protocol Buffers}

  - id: zig
    enabled: true
    libraries:
      - {name: std.json, writes_named_fields: true, role: JSON — stdlib}
      - {name: serde.json, writes_named_fields: true, role: JSON — serde.zig}
      - {name: serde.msgpack, writes_named_fields: true, role: MessagePack}
