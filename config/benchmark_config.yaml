# =============================================================================
# Multi-Language Serializer Benchmark — Master Configuration
# =============================================================================
# Single source of truth for runners, analysis, and documentation.
# Language-specific overrides live under `languages.<lang>`.
# Add a new language by copying an existing block and implementing the benchmark runner.
# =============================================================================

version: "2.0.0"

# -----------------------------------------------------------------------------
# Project metadata
# -----------------------------------------------------------------------------
project:
  name: "Multi-Language Serializer Benchmark"
  description: >
    Scientific, multi-language benchmark suite for evaluating serialization
    libraries. Supports researchers (reproducible statistics), serializer authors
    (version A vs B), system integrators (custom payloads/environments), and
    maintainers (add languages without rewriting analysis).
  license: MIT
  output_schema_version: "1.1"

# -----------------------------------------------------------------------------
# Reproducibility
# -----------------------------------------------------------------------------
reproducibility:
  random_seed: 42
  # Pin CPU affinity / thread count in runners when possible
  single_threaded: true
  # How many leading repetitions are treated as warmup *by analysis only*.
  # Benchmark runners MUST still write those rows to the raw CSV (RepetitionIndex 0..n-1
  # with no post-filter). Warmup is dropped only when statistics.exclude_warmup
  # is true in the analysis package — never when logging.
  warmup_repetitions: 1
  # Environment capture written beside logs
  capture_environment: true
  # Timed-trial order within each (cell, I/O mode). See docs/analysis/architecture.md
  # (schedule / block_shuffle). Env override: BENCHMARK_SCHEDULE=none|block_shuffle
  schedule:
    # none          — legacy: often serializer-outer, fixed registration order
    # block_shuffle — default: mode blocks; each rep shuffles serializers (Fisher–Yates)
    strategy: block_shuffle
    # Emit optional CSV columns RunOrder (+ SchedulePosition when the runner supports it)
    record_run_order: true

# -----------------------------------------------------------------------------
# Execution modes (CLI / scripts map to these)
# -----------------------------------------------------------------------------
modes:
  smoke:
    repetitions: 2
    description: "Minimal sanity run (CI fast path)"
  all-single:
    repetitions: 10
    description: "Quick full-matrix pass"
  full:
    repetitions: 100
    description: "Publication-quality run"
  research:
    repetitions: 500
    description: "High-power statistical study"

# -----------------------------------------------------------------------------
# Suite data model
# -----------------------------------------------------------------------------
data_model_v2:
  enabled: true
  default: current
  catalog_file: "schemas/data_catalog_v2.yaml"
  library_root: "config/library"
  default_run_config: "config/library/default.yaml"
  smoke_run_config: "config/library/smoke.yaml"
  schemas_root: "schemas/v2"
  generate_script: "scripts/schemas/generate-all.sh"

# Shared test data — catalog is normative; names are type_id values.
test_data:
  catalog_file: "schemas/data_catalog_v2.yaml"
  types:
    - name: message
      category: flat_mixed
      description: "Single-level mixed primitives"
      supports_circular: false
    - name: document
      category: nested
      description: "Nested document with items"
      supports_circular: false
    - name: telemetry
      category: numeric_bulk
      description: "Numeric bulk / tags (points axis in type_config)"
      supports_circular: false
    - name: strings
      category: text_bulk
      description: "String bulk / memory pressure"
      supports_circular: false
    - name: event
      category: envelope
      description: "Event envelope with attributes"
      supports_circular: false

# -----------------------------------------------------------------------------
# Dual-mode I/O contract (every language implements both when applicable)
# -----------------------------------------------------------------------------
io_modes:
  - name: bytes
    aliases: [string, buffer]
    description: "In-memory buffer / byte array API"
  - name: stream
    aliases: [stream]
    description: "Streaming / incremental I/O API"

# -----------------------------------------------------------------------------
# CSV output contract (all language runners MUST emit this schema)
# TimeSer / TimeDeser / TimeSerAndDeser are always in nanoseconds (all languages,
# including C#). Published Results tables may display latency in microseconds.
# -----------------------------------------------------------------------------
csv_schema:
  # SerializerVersion is immediately after SerializerName (library/package version
  # as installed at run time — not a major-only stub). Optional columns may follow.
  required_columns:
    - Language
    - StringOrStream
    - TestDataName
    - Repetitions
    - RepetitionIndex
    - SerializerName
    - SerializerVersion
    - TimeSer
    - TimeDeser
    - Size
    - TimeSerAndDeser
    - OpPerSecSer
    - OpPerSecDeser
    - OpPerSecSerAndDeser
  optional_columns:
    - MemoryPeakBytes
    - FidelityScore
    - ErrorFlag
    - NativeKind
    # StreamMode: required on NEW stream I/O rows — native|text_on_stream|adapted (B-6)
    - StreamMode
    - RunOrder
    - SchedulePosition
  time_unit: nanoseconds

# -----------------------------------------------------------------------------
# Scientific statistics (analysis pipeline)
# -----------------------------------------------------------------------------
statistics:
  # Pre-processing (analysis package only — raw logs under logs/<lang>/ are never rewritten)
  # Drop rows with RepetitionIndex < reproducibility.warmup_repetitions (currently index 0)
  # before outlier filtering and summaries. Raw CSVs still contain those rows.
  exclude_warmup: true
  outlier_method: iqr          # iqr | none | winsorize
  iqr_k: 1.5
  min_samples_for_outlier_filter: 10
  # Below this many (post-filter) observations, bootstrap CIs and some
  # hypothesis tests are not computed (or become the point estimate itself).
  # Values < ~5 produce degenerate / uninformative intervals.
  min_samples_for_inference: 5

  # Central tendency & dispersion
  # NOTE: The report_* toggles are read for documentation but the analysis
  # currently always emits the full set of metrics (design goal = rich stats).
  # Changing them has no effect at present.
  report_mean: true
  report_median: true
  report_std: true
  report_mad: true             # median absolute deviation
  report_cv: true              # coefficient of variation
  report_percentiles: [5, 25, 50, 75, 95, 99]
  report_min_max: true

  # Confidence intervals (non-parametric bootstrap on mean)
  bootstrap:
    enabled: true
    iterations: 2000
    confidence_level: 0.95
    seed: 42
    method: percentile        # only "percentile" implemented; "bca" accepted but ignored

  # Effect sizes (pairwise vs fastest in group)
  effect_sizes:
    enabled: true
    methods: [cliffs_delta, hedges_g]  # both are always computed when enabled
    cliffs_delta_thresholds:
      negligible: 0.147
      small: 0.33
      medium: 0.474
      # > medium => large

  # Hypothesis testing (optional, for version A/B comparisons)
  hypothesis_tests:
    enabled: true
    method: mann_whitney_u     # only mann_whitney_u implemented
    alpha: 0.05
    multiple_comparison_correction: holm

  # Throughput derivation (documented but the code path is fixed)
  throughput_from: mean_time_ns   # always 1e9 / mean total time in ns

# -----------------------------------------------------------------------------
# Paths (relative to repository root)
# -----------------------------------------------------------------------------
paths:
  logs_root: logs
  reports_root: reports
  schemas_root: schemas
  config_root: config
  # language_log_dirs: discovery order / docs; CLI still auto-discovers logs/<lang>/.
  language_log_dirs:
    csharp: logs/csharp
    python: logs/python
    rust: logs/rust
    c: logs/c
    javascript: logs/javascript
    go: logs/go
    java: logs/java
    cpp: logs/cpp
    swift: logs/swift
  # Result files are timestamped to preserve history across runs.
  # Each run creates (same stem):
  #   YYYY-MM-DD-HHMMSS.csv
  #   YYYY-MM-DD-HHMMSS.configs.json    (environment + optional dataset/serializer metadata)
  #   YYYY-MM-DD-HHMMSS.errors.csv      (only when there are fidelity/runner failures)
  #   (legacy) YYYY-MM-DD-HHMMSS.environment.json still readable by analysis
  # Analysis auto-selects the most recent timestamped result CSV per language.
  log_filename: "YYYY-MM-DD-HHMMSS.csv"
  configs_filename: "YYYY-MM-DD-HHMMSS.configs.json"
  errors_filename: "YYYY-MM-DD-HHMMSS.errors.csv"
  baseline_filename: reports/baseline.json

# -----------------------------------------------------------------------------
# Run sidecar (configs.json written beside each result CSV)
# -----------------------------------------------------------------------------
run_sidecar:
  # Prefer configs.json; analysis also loads legacy .environment.json
  filename_suffix: "configs.json"
  include_environment: true
  # dataset / serializers blocks are optional enrichment (best-effort)
  include_dataset: true
  include_serializers: true

# -----------------------------------------------------------------------------
# Metric importance (multi-way leaderboards vs pairwise / version A/B)
# Full catalog: docs/analysis/METRICS.md
# -----------------------------------------------------------------------------
metrics:
  catalog_version: "1"
  # multi_way: language Results, N-serializer pivots (keeps published surface small)
  multi_way:
    include_importance: [high]
    rank_by: total_median_ns          # lower is better
    secondary_rank_by: median_size_bytes
  # pairwise: --compare-a/--compare-b or explicit --metrics-profile pairwise|full
  pairwise:
    include_importance: [high, medium, low]
  # Field id → importance (unknown ids default to medium)
  importance:
    total_median_ns: high
    ser_median_ns: high
    deser_median_ns: high
    avg_time_total_ns: medium
    avg_time_ser_ns: medium
    avg_time_deser_ns: medium
    total_mean_ns: medium
    ser_mean_ns: medium
    deser_mean_ns: medium
    avg_ops_per_sec: high
    median_size_bytes: high
    mean_fidelity: high
    serializer_version: high
    runs: high
    runs_raw: medium
    warmup_skipped: medium
    outliers_removed: medium
    total_ci_low_ns: medium
    total_ci_high_ns: medium
    total_p95_ns: medium
    total_p99_ns: medium
    total_cv: medium
    total_mad_ns: medium
    total_std_ns: medium
    mean_memory_peak_bytes: medium
    effect_vs_fastest_cliffs_delta: medium
    effect_vs_fastest_cliffs_label: medium
    effect_vs_fastest_hedges_g: low
    mann_whitney_u: medium
    p_value: medium
    p_value_holm: medium

# -----------------------------------------------------------------------------
# Regression gates (CI quality gate)
# -----------------------------------------------------------------------------
# Plain-language policy (A-4): a run is a REGRESSION only when BOTH:
#   (1) the point estimate is more than threshold_percent slower than baseline, AND
#   (2) even the optimistic end of the bootstrap CI is still that much slower.
# Using AND (not OR) avoids failing the gate when a noisy mean moves but the
# data still look compatible with "about the same speed". See methodology.
regression:
  enabled: true
  threshold_percent: 10.0
  # Preferred point estimate for the practical % check (falls back to mean).
  metric: total_median_ns
  # and = both practical + CI (default); or = legacy noisier fail; practical_only / statistical_only
  combine: and
  direction: higher_is_worse
  cliffs_delta:
    enabled: true
    # Same "negligible" cut as statistics.effect_sizes (Vargha–Delaney / Cliff)
    min_delta: 0.147
    # If true, also require δ ≥ min_delta (current slower) before failing
    require_for_fail: false
  # Store a capped sample of total times so later runs can compute Cliff's δ vs baseline
  store_samples: true
  max_samples_stored: 500

# -----------------------------------------------------------------------------
# Language benchmark runners
# -----------------------------------------------------------------------------
languages:
  csharp:
    display_name: "C# (.NET)"
    enabled: true
    runner_dir: c-sharp
    runner_script: scripts/run-benchmarks.sh
    log_dir: logs/csharp
    time_unit: nanoseconds
    docs_dir: docs/c-sharp
    # 38 serializers registered (Program.cs); all run on all V2 data types.
    # Dropped: Apex.Serialization (net8 FieldInfoModifier crash), FluentSerializer (unsuitable graphs).
    # Added: System.Text.Json, Apache.Avro. See docs/c-sharp/index.md for inventory + PrepareData projections.

  python:
    display_name: Python
    enabled: true
    runner_dir: python
    runner_script: scripts/run-benchmarks.sh
    log_dir: logs/python
    time_unit: nanoseconds
    docs_dir: docs/python
    serializers:
      - name: orjson
        category: json
        package: orjson
        rationale: "Fastest mainstream Python JSON (Rust core)"
      - name: msgspec
        category: json
        package: msgspec
        rationale: "High-performance typed JSON via msgspec"
      - name: rapidjson
        category: json
        package: python-rapidjson
        rationale: "C++ RapidJSON bindings"
      - name: msgspec-msgpack
        category: binary
        package: msgspec
        rationale: "msgspec MessagePack backend"
      - name: msgpack
        category: binary
        package: msgpack
        rationale: "Reference MessagePack implementation"
      - name: cbor2
        category: binary
        package: cbor2
        rationale: "IETF CBOR with cycle support option"
      - name: protobuf
        category: schema
        package: protobuf
        rationale: "Google Protocol Buffers"
      - name: avro
        category: schema
        package: fastavro
        rationale: "Apache Avro (fastavro)"
      - name: pickle
        category: native
        package: stdlib
        rationale: "Python standard library pickle"
      - name: cloudpickle
        category: native
        package: cloudpickle
        rationale: "Extended pickle for complex objects"

  rust:
    display_name: Rust
    enabled: true
    runner_dir: rust
    runner_script: scripts/run-benchmarks.sh
    log_dir: logs/rust
    time_unit: nanoseconds
    docs_dir: docs/rust
    cargo_package: serializer-benchmark-rust
    serializers:
      - name: serde_json
        category: json
        crate: serde_json
        rationale: "De-facto standard JSON via serde"
        optimal_api: "to_vec / from_slice (no pretty-print)"
      - name: simd-json
        category: json
        crate: simd-json
        rationale: "SIMD-accelerated JSON parser"
        optimal_api: "serde::from_slice on mut buf (serialize via serde_json)"
      - name: sonic-rs
        category: json
        crate: sonic-rs
        rationale: "Very fast JSON (SIMD, zero-copy lean)"
        optimal_api: "to_vec / from_slice"
      - name: rmp-serde
        category: binary
        crate: rmp-serde
        rationale: "MessagePack via serde"
        optimal_api: "to_vec_named / from_slice"
      - name: ciborium
        category: binary
        crate: ciborium
        rationale: "CBOR (IETF) via serde"
        optimal_api: "into_writer / from_reader on Vec"
      - name: bincode
        category: binary
        crate: bincode
        rationale: "Compact Rust-native binary format"
        optimal_api: "serde::encode_to_vec / decode_from_slice (bincode 2)"
      - name: postcard
        category: binary
        crate: postcard
        rationale: "no_std-friendly compact binary"
        optimal_api: "to_allocvec / from_bytes"
      - name: bitcode
        category: binary
        crate: bitcode
        rationale: "Bit-packed fast binary codec"
        optimal_api: "serialize / deserialize"
      - name: flexbuffers
        category: schema
        crate: flexbuffers
        rationale: "FlatBuffers FlexBuffers (schemaless subset)"
        optimal_api: "FlexbufferSerializer / Reader"
      - name: minicbor
        category: binary
        crate: minicbor
        rationale: "Lightweight CBOR (wrapper path for untagged data-type enum)"
        optimal_api: "to_vec / decode (MessagePack payload as CBOR byte string)"
      - name: rkyv
        category: zero_copy
        crate: rkyv
        rationale: "Zero-copy archive deserialization"
        optimal_api: "to_bytes / access + deserialize (archives MessagePack payload)"
      - name: prost
        category: schema
        crate: prost
        rationale: "De-facto Rust Protocol Buffers (prost + prost-build from shared suite protos)"
        optimal_api: "Message::encode / decode on prepared messages (convert in prepare)"
      - name: serde_avro_fast
        category: schema
        crate: serde_avro_fast
        rationale: "High-performance Avro binary datum (serde one-pass; wire-compatible with apache-avro)"
        optimal_api: "to_datum + reused SerializerConfig / from_datum_slice; schema once in prepare"

  c:
    display_name: C
    enabled: true
    runner_dir: c
    runner_script: scripts/run-benchmarks.sh
    log_dir: logs/c
    time_unit: nanoseconds
    docs_dir: docs/c
    build_system: cmake
    serializers:
      - name: cJSON
        category: json
        library: cJSON
        rationale: "Ubiquitous lightweight C JSON"
        optimal_api: "cJSON_PrintUnformatted / cJSON_Parse"
      - name: yyjson
        category: json
        library: yyjson
        rationale: "Fastest C JSON (SIMD, immutable DOM)"
        optimal_api: "yyjson_mut_write / yyjson_read"
      - name: jansson
        category: json
        library: jansson
        rationale: "Widely deployed C JSON (hash tables)"
        optimal_api: "json_dumps / json_loads"
      - name: parson
        category: json
        library: parson
        rationale: "Simple single-file C JSON"
        optimal_api: "json_serialize_to_string / json_parse_string"
      - name: json-c
        category: json
        library: json-c
        rationale: "Distro-default system JSON (libjson-c)"
        optimal_api: "json_object_to_json_string_ext / json_tokener_parse"
      - name: mpack
        category: binary
        library: mpack
        rationale: "MessagePack in pure C (ludocode/mpack)"
        optimal_api: "mpack_writer / mpack_tree"
      - name: msgpack-c
        category: binary
        library: msgpack-c
        rationale: "Official MessagePack C runtime"
        optimal_api: "msgpack_pack_* / msgpack_unpack_*"
      - name: tinycbor
        category: binary
        library: tinycbor
        rationale: "Intel tinycbor (IETF CBOR)"
        optimal_api: "cbor_encoder / cbor_parser"
      - name: cbor-encode
        category: binary
        library: libcbor
        rationale: "libcbor reference implementation"
        optimal_api: "cbor_serialize_alloc / cbor_load"
      - name: qcbor
        category: binary
        library: QCBOR
        rationale: "IETF/IoT CBOR (QCBOR)"
        optimal_api: "QCBOREncode_* / QCBORDecode_*"
      - name: ubj
        category: binary
        library: in-tree
        rationale: "UBJSON (spec-faithful minimal codec)"
        optimal_api: "ubj map writer/reader"
      - name: libbson
        category: binary
        library: libbson
        rationale: "MongoDB BSON"
        optimal_api: "bson_append_* / bson_iter_*"
      - name: custom-binary
        category: binary
        library: harness
        rationale: "Hand-packed C struct baseline"
        optimal_api: "bin_write_fixture / bin_read_fixture"
      - name: nanopb
        category: schema
        library: nanopb
        rationale: "Protocol Buffers for embedded C (stream API)"
        optimal_api: "pb_ostream / pb_istream field tags"
      - name: protobuf-c
        category: schema
        library: protobuf-c
        rationale: "Version from real lib; timed path still suite fixture_pb_full wire codec (not full codegen pack)"
        optimal_api: "fixture_pb_full encode/decode (prefer Google protobuf row)"
      - name: protobuf
        category: schema
        library: libprotobuf (Google)
        rationale: "Official Google Protocol Buffers C++ runtime used from C benchmark runner (SerializeToArray/ParseFromArray)"
        optimal_api: "prepare Message; timed SerializeToArray / ParseFromArray"
      - name: protobuf-wire
        category: schema
        library: in-tree-wire
        rationale: "In-tree proto wire (was logged as upb); NOT Google upb"
        optimal_api: "fixture_pb_full field tags"
      - name: flatcc
        category: schema
        library: flatcc
        rationale: "FlatBuffers C builder/reader"
        optimal_api: "flatcc_builder_* / table reader"
      - name: avro-c
        category: schema
        library: avro-c
        rationale: "Apache Avro C binary encoding"
        optimal_api: "avro_value_write / avro_value_read"
      - name: zcbor
        category: schema
        library: zcbor
        rationale: "Nordic zcbor structured CBOR encode/decode"
        optimal_api: "zcbor_map_start_encode / zcbor_map_start_decode"

  javascript:
    display_name: "JavaScript (Node.js)"
    enabled: true
    runner_dir: javascript
    runner_script: scripts/run-benchmarks.sh
    log_dir: logs/javascript
    time_unit: nanoseconds
    docs_dir: docs/javascript
    runtime: node
    min_node_version: "18"
    # B-6: timed path is identical for bytes and stream labels — do not claim stream.
    stream_policy: bytes_only
    serializers:
      - name: JSON.stringify
        category: json
        package: builtin
        rationale: "ECMAScript built-in baseline"
        optimal_api: "JSON.stringify / JSON.parse"
      - name: fast-json-stringify
        category: json
        package: fast-json-stringify
        rationale: "Schema-compiled fast stringify (Fastify stack)"
        optimal_api: "compiled stringify + JSON.parse"
      - name: simdjson
        category: json
        package: simdjson
        rationale: "SIMD JSON parse (optional native addon)"
        optimal_api: "simdjson.parse + JSON.stringify (roundtrip)"
      - name: msgpackr
        category: binary
        package: msgpackr
        rationale: "Fast Node MessagePack"
        optimal_api: "Packr.pack / Unpackr.unpack (reuse)"
      - name: "@msgpack/msgpack"
        category: binary
        package: "@msgpack/msgpack"
        rationale: "Official msgpack.org encoder"
        optimal_api: "encode / decode"
      - name: cbor-x
        category: binary
        package: cbor-x
        rationale: "Fast CBOR for Node/browsers"
        optimal_api: "Encoder.encode / Decoder.decode (reuse)"
      - name: cbor
        category: binary
        package: cbor
        rationale: "Reference node-cbor"
        optimal_api: "encode / decodeFirstSync"
      - name: bson
        category: binary
        package: bson
        rationale: "MongoDB BSON"
        optimal_api: "BSON.serialize / deserialize"
      - name: bser
        category: binary
        package: bser
        rationale: "Facebook Binary JSON (Watchman)"
        optimal_api: "dumpToBuffer / loadFromBuffer"
      - name: json-pack-msgpack
        category: binary
        package: "@jsonjoy.com/json-pack"
        rationale: "json-joy high-performance TS MessagePack"
        optimal_api: "MsgPackEncoder.encode / MsgPackDecoder.decode"
      - name: sia
        category: binary
        package: "@timeleap/sia"
        rationale: "Sia pure-JS binary (JSON-model over Sia primitives)"
        optimal_api: "Sia add*/read* with typed tags"
      - name: avsc
        category: schema
        package: avsc
        rationale: "Apache Avro pure JS with explicit data-type schemas"
        optimal_api: "Type.forSchema + toBuffer / fromBuffer"
      - name: protobufjs
        category: schema
        package: protobufjs
        rationale: "Classic Protocol Buffers in JS (real data-type messages)"
        optimal_api: "Type.encode / decode (preloaded Root)"
      - name: protobuf-es
        category: schema
        package: "@bufbuild/protobuf"
        rationale: "Modern Protobuf-ES (Buf) from generated schemas"
        optimal_api: "create + toBinary / fromBinary"
      - name: google-protobuf
        category: schema
        package: google-protobuf
        rationale: "Official Google JS runtime (jspb) from protoc --js_out"
        optimal_api: "serializeBinary / deserializeBinary on prepared messages"
      - name: flatbuffers
        category: schema
