name: Benchmark CI

# Optional harness smoke checks only. Summaries and plots are generated
# locally and committed under docs/analysis/ for GitHub Pages — never here.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
      - 'docs/**'
      - 'mkdocs.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Benchmark mode'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - all-single
          - full

jobs:
  csharp-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run C# Benchmark
        run: |
          cd c-sharp
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}

  python-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Python Benchmark
        run: |
          cd python
          ./scripts/run-benchmarks.sh ${{ github.event.inputs.mode || 'smoke' }}
