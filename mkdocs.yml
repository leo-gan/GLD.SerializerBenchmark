site_name: Cross-Language Serializer Benchmark
site_description: Cross-language serialization performance comparison.
site_url: https://leo-gan.github.io/GLD.SerializerBenchmark/
repo_url: https://github.com/leo-gan/GLD.SerializerBenchmark
repo_name: leo-gan/GLD.SerializerBenchmark

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
#    - navigation.indexes
#    - navigation.expand
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - redirects:
      redirect_maps:
        'index.md': 'theory/index.md'

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite

nav:
  - Serialization 101:
      - Theory & Practices: theory/index.md
      - Historical Perspective: theory/historical_perspective.md
      - Data Science Perspective: theory/data_science_perspective.md
      - Engineer Perspective: theory/engineer_perspective.md
  - C#:
      - Overview: c-sharp/index.md
      - Results: c-sharp/results.md
  - Python:
      - Overview: python/index.md
      - Results: python/results.md
  - Rust:
      - Overview: rust/index.md
      - Results: rust/results.md
  - C:
      - Overview: c/index.md
      - Results: c/results.md
  - JavaScript:
      - Overview: javascript/index.md
      - Results: javascript/results.md
  - Architecture:
      - Overview: architecture/index.md
      - Adding a Language: architecture/ADDING_A_LANGUAGE.md
  - Selection Guide:
      - Overview: serializers/index.md
      - Json Serializers: serializers/json.md
      - Binary Serializers: serializers/binary.md
      - Schema-based Serializers: serializers/schema.md
  - Benchmarks:
      - Overview: analysis/index.md
      - Serialization Categories: analysis/serialization_categories.md
      - Analysis Methodology: analysis/ANALYSIS_METHODOLOGY.md
      - Test Data Configuration: analysis/test_data_configuration.md
      - Benchmark Results: analysis/BENCHMARK_SUMMARY.md
