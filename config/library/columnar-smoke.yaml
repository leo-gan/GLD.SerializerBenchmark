# Run config: smoke for columnar and aligned-record types.
# Not the suite smoke path. Invoke with:
#   BENCHMARK_RUN_CONFIG=config/library/columnar-smoke.yaml
# An empty serializer filter selects serializer_data_sets for columnar
# on runners whose comma filter is exact. A passed filter still narrows.
# Python applies the same map in the runner. Do not rely on Supports()
# alone: several harnesses return true for every type name.
id: columnar-smoke
description: "table, table_project, nested_table, signal at N=1; bytes; no post-compression"
data_model_version: 2

types:
  - type_id: table
    type_config: {}
  - type_id: table_project
    type_config: {}
  - type_id: nested_table
    type_config: {}
  - type_id: signal
    type_config: {}

data_type_instance_count: [1]

compression:
  mode: none

execution:
  mode: smoke
  io_modes: [bytes]

budget:
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 600
  reps_fallback: 50
