[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchmark-analysis"
version = "0.7.0"
description = "Benchmark analysis and reporting tools"
requires-python = ">=3.12"
authors = [
    { name = "Leonid Ganeline", email = "leo.gan.57@gmail.com" },
]
dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.scripts]
analyze-benchmarks = "benchmark_analysis.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
