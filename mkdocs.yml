site_name: Multi-Language Serializer Benchmark
site_description: Fair multi-language serializer benchmarks — live dashboard, course, and open methodology.
site_url: https://leo-gan.github.io/GLD.SerializerBenchmark/
repo_url: https://github.com/leo-gan/GLD.SerializerBenchmark
repo_name: leo-gan/GLD.SerializerBenchmark

exclude_docs: |
  dashboard/logs/**
  internal/**


theme:
  name: material
  custom_dir: docs_theme
  features:
    # Header tabs: Learn | Languages | Benchmarks | Dashboard | Experiments | Compliance
    - navigation.tabs
    - navigation.tabs.sticky
    # Left sidebar: sections under the active tab (Learn, Languages, Benchmarks)
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - navigation.top
    # Right sidebar: in-page headings (requires toc.integrate OFF)
    - toc.follow
    # Code blocks: one-click copy
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - redirects:
      redirect_maps:
        # Legacy top-level theory pages redirected into Part I (101) and Part II (201).
        'theory/historical_perspective.md': 'theory/101/historical_perspective.md'
        'theory/data_science_perspective.md': 'theory/101/data_science_perspective.md'
        'theory/engineer_perspective.md': 'theory/101/engineer_perspective.md'
        'theory/deep-dives/index.md': 'theory/201/index.md'
        'theory/deep-dives/memory-layout.md': 'theory/201/memory-layout.md'
        'theory/deep-dives/encode-decode-cost.md': 'theory/201/encode-decode-cost.md'
        'theory/deep-dives/self-describing-vs-schema-dependent.md': 'theory/201/self-describing-vs-schema-dependent.md'
        'theory/deep-dives/schema-evolution.md': 'theory/201/schema-evolution.md'
        'theory/deep-dives/dynamic-vs-idl-binary.md': 'theory/201/dynamic-vs-idl-binary.md'
        'theory/deep-dives/zero-copy.md': 'theory/201/zero-copy.md'
        'theory/deep-dives/compression-is-not-a-format.md': 'theory/201/compression-is-not-a-format.md'
        'serializers/index.md': 'analysis/families.md'
        'serializers/json.md': 'analysis/families.md'
        'serializers/binary.md': 'analysis/families.md'
        'serializers/schema.md': 'analysis/families.md'
        'serializers/native.md': 'analysis/families.md'
        'architecture/index.md': 'analysis/architecture.md'
        'architecture/ADDING_A_LANGUAGE.md': 'analysis/ADDING_A_LANGUAGE.md'
        'architecture/ADDING_A_SERIALIZER.md': 'analysis/ADDING_A_SERIALIZER.md'
        'c/results.md': 'c/index.md'
        'c-sharp/results.md': 'c-sharp/index.md'
        'cpp/results.md': 'cpp/index.md'
        'go/results.md': 'go/index.md'
        'java/results.md': 'java/index.md'
        'javascript/results.md': 'javascript/index.md'
        'kotlin/results.md': 'kotlin/index.md'
        'php/results.md': 'php/index.md'
        'python/results.md': 'python/index.md'
        'rust/results.md': 'rust/index.md'
        'swift/results.md': 'swift/index.md'
        'analysis/BENCHMARK_SUMMARY.md': 'analysis/CLAIMS_AND_REPLICATION.md'
        'analysis/serialization_categories.md': 'analysis/families.md'
        'analysis/array_bindings.md': 'analysis/array.md'
        'analysis/data_model_v2.md': 'analysis/test_data_configuration.md'

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Languages sidebar: compact "Lang · Dashboard" rows (see languages-nav.*).
extra_css:
  - stylesheets/languages-nav.css
  - stylesheets/sidebar-nav.css
  - stylesheets/academic.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
extra_javascript:
  - javascripts/languages-nav.js
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js

