[package]
name = "serializer-benchmark-rust"
version = "0.2.0"
edition = "2021"
description = "Rust harness for the Multi-Language Serializer Benchmark"
license = "MIT"
build = "build.rs"

# Cargo caret defaults (e.g. "1" / "0.14") already allow minor+patch within the
# stated major (or 0.x minor). Run `cargo update` to refresh Cargo.lock.
# Available *major* upgrades (bincode 3, bson 3, prost 0.14, simd-json 0.17, …)
# are intentionally not taken without a harness compatibility pass.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simd-json = { version = "0.14", features = ["serde_impl"] }
sonic-rs = "0.3"
rmp-serde = "1"
ciborium = "0.2"
bincode = { version = "2", features = ["serde"] }
postcard = { version = "1", features = ["alloc", "use-std"] }
bitcode = { version = "0.6", features = ["serde"] }
flexbuffers = "2"
rkyv = { version = "0.8", features = ["std", "bytecheck", "alloc"] }
minicbor = { version = "0.25", features = ["std", "derive"] }
prost = "0.13"
apache-avro = "0.21"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Priority B
bson = "2"
nanoserde = "0.1.37"  # ^0.1.37 → latest 0.1.x only (0.2 is a separate minor line)
speedy = "0.8"
bytes = "1"
# Deterministic fixture generation (see data.rs — nothing-up-my-sleeve π seeds).
rand = "0.8"
rand_pcg = "0.3"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
