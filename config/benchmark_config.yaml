# -----------------------------------------------------------------------------
# Extensibility: template for adding a language
# -----------------------------------------------------------------------------
# languages.<id>:
#   display_name: "..."
#   enabled: false
#   runner_dir: <dir>
#   runner_script: scripts/run-benchmarks.sh
#   log_dir: logs/<id>
#   time_unit: nanoseconds
#   docs_dir: docs/<id>
#   serializers: [...]
#
# Runtime consumers of this file (do not hard-code these values in scripts):
#   - scripts/read-config.py / scripts/lib/config.sh  — shell runners & run-all
#   - analysis.config_loader / load_stats_config      — analyze-benchmarks
#   - modes.<name>.repetitions → run-benchmarks.sh REPS
#   - languages.*.enabled / runner_dir / runner_script → run-all-benchmarks.sh
#   - reproducibility.random_seed → BENCHMARK_SEED env for benchmark runners
#   - paths.* / regression.* → analysis CLI defaults
#
# Required benchmark-runner contract:
#   1. Prefer modes/seed from this file (via scripts/lib/config.sh + BENCHMARK_SEED)
#   2. Emit logs/<id>/<timestamp>.csv (YYYY-MM-DD-HHMMSS.csv)
#      with Language=<id> and times in nanoseconds. Never overwrite previous runs.
#   3. Implement prepare() outside timed loop; timed section = serialize + deserialize only
#   4. Support bytes + stream modes where the library allows
#   5. Round-trip fidelity on v2 type_ids (message|document|telemetry|strings|event);
#      Supports(type_id)=false may skip incapable codecs (no empty .errors.csv on clean runs)
#   6. Write *.configs.json sidecar (or let run-benchmarks.sh capture it)
#   7. scripts/run-benchmarks.sh accepts smoke|all-single|full|research;
#      smoke dataFilter defaults to a cheap cell (typically message)

