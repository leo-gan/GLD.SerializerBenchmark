# Run config: default (publication matrix) — suite fixtures
id: default
description: "Five type ids × [1, 100] instances; size_only compression metrics once per cell"
data_model_version: 2

types:
  - type_id: message
    type_config: {}
  - type_id: document
    type_config: {}
  - type_id: telemetry
    type_config: {}
  - type_id: strings
    type_config: {}
  - type_id: event
    type_config: {}

data_type_instance_count: [1, 100]

compression:
  mode: size_only
  algorithms: [gzip_6, zstd_3]

execution:
  mode: full
  io_modes: [bytes]

budget:
  # soft_budget_seconds = 60 * ceil(n_serializers / 10); hard_cap_seconds = 600
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 600
  reps_fallback: 50
