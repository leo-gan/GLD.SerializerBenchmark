# Single settings file for this experiment.
# Change this file to change the experiment.

schema: gld.experiment.config/1
id: 02-flat-record-formats
title: Should two services inside the company stop using JSON?
question: On one small record, how do JSON, MessagePack, and Protocol Buffers compare?
story:
  why: Inside a company you may pick a denser format. That is a real cost (new tools, harder debugging). We measure whether the gain is large.
  example: Imagine two programs that your company owns. They send a small record to each other on a private network. No web browser is involved.
  tradeoff: JSON is ordinary text, so a person can open the bytes and read the field names. MessagePack and Protocol Buffers usually write fewer bytes. Protocol Buffers requires both sides to share a list of field names and numbers before they talk. MessagePack does not require that shared list.

sample:
  kind: message
  records_per_write: [1, 100]
  seed: 42
  settings: {}
  saved_as: sample.json

run:
  mode: full
  io_modes: [bytes, stream]
  compression: size_only
  compression_algorithms: [gzip_6, zstd_3]
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 600
  reps_fallback: 50

analysis:
  drop_first_trial: true
  filter_id: iqr_1.5
  main_io: memory
  # Mixed formats: every listed library is in the comparison set.
  require_named_fields: false
  top_group:
    method: cliffs_delta_vs_fastest
    similar_max: 0.147
    close_max: 0.33

paths:
  results: results.json
  summary: results.md

languages:
  - id: python
    enabled: true
    libraries:
      - {name: json, writes_named_fields: true, role: JSON — ships with Python}
      - {name: orjson, writes_named_fields: true, role: JSON — fast writer from Experiment 1}
      - {name: msgpack, writes_named_fields: true, role: MessagePack}
      - {name: msgspec-msgpack, writes_named_fields: true, role: MessagePack — msgspec}
      - {name: protobuf, writes_named_fields: true, role: Protocol Buffers}

  - id: go
    enabled: true
    libraries:
      - {name: encoding/json, writes_named_fields: true, role: JSON — ships with Go}
      - {name: goccy/go-json, writes_named_fields: true, role: JSON — fast writer from Experiment 1}
      - {name: vmihailenco/msgpack, writes_named_fields: true, role: MessagePack}
      - {name: shamaton/msgpack, writes_named_fields: true, role: MessagePack — fast Go writer}
      - {name: protobuf, writes_named_fields: true, role: Protocol Buffers}

  - id: java
    enabled: true
    libraries:
      - {name: jackson, writes_named_fields: true, role: JSON — common default}
      - {name: jsoniter, writes_named_fields: true, role: JSON — fast writer from Experiment 1}
      - {name: msgpack, writes_named_fields: true, role: MessagePack}
      - {name: protobuf, writes_named_fields: true, role: Protocol Buffers}

  - id: kotlin
    enabled: true
    libraries:
      - {name: jackson, writes_named_fields: true, role: JSON — common default}
      - {name: moshi-codegen, writes_named_fields: true, role: JSON — fast writer from Experiment 1}
      - {name: kotlinx-json, writes_named_fields: true, role: JSON — compiler-generated kotlinx.serialization}
      - {name: msgpack, writes_named_fields: true, role: MessagePack}
      - {name: protobuf, writes_named_fields: true, role: Protocol Buffers}

  - id: php
    enabled: true
    libraries:
      - {name: json, writes_named_fields: true, role: JSON — stdlib}
      - {name: rybakit-msgpack, writes_named_fields: true, role: MessagePack}
      - {name: protobuf, writes_named_fields: true, role: Protocol Buffers}

  - id: javascript
    enabled: true
    libraries:
      - {name: JSON.stringify, writes_named_fields: true, role: JSON — ships with JavaScript}
