# Run config: publication cells for the array data set.
# Not default.yaml. Invoke with:
#   BENCHMARK_RUN_CONFIG=config/library/array.yaml
# An empty serializer filter selects serializer_data_sets for array
# on runners whose comma filter is exact. Examples:
#   hdf5-fortran,netcdf-fortran,adios2,gld-arrow
#   h5py,netCDF4,adios2
#   hdf5
#   highfive
#   hdf5-metno
#   PureHDF
#   h5wasm
#   gld-hdf5
# Runners skip every other serializer on these type ids.
# The Mojo filter is a substring. An empty filter is safe: only gld-hdf5 runs these cells.
# N stays 1. The array shape is the type config, not the instance count.
id: array
description: "grid and grid_window at N=1; bytes sidecar; no post-compression"
data_model_version: 2

types:
  - type_id: grid
    type_config: {}
  - type_id: grid_window
    type_config: {}

data_type_instance_count: [1]

compression:
  mode: none

execution:
  mode: full
  io_modes: [bytes]

budget:
  soft_seconds_per_10_serializers: 60
  hard_cap_seconds: 600
  reps_fallback: 50
